[package]
name = "vanguard"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "vanguard"
path = "src/lib.rs"

[[bin]]
name = "vanguardd"
path = "src/main.rs"

[[bin]]
name = "vgctl"
path = "bin/vgctl.rs"

[dependencies]
clap = { version = "4.5.61", features = ["derive"] }
getrandom = "0.3.4"
hmac = "0.12.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "signal"] }
toml = "1.0.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27.0"
