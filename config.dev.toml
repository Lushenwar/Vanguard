# Development configuration. Everything lives under the repo so a dev run never
# touches /var and never needs root.

[runtime]
state_dir = "./.vanguard"
socket    = "./.vanguard/vanguard.sock"
control_addr = "127.0.0.1:50505"
log_level = "debug"

[limits]
max_steps               = 50
max_consecutive_rejects = 3
state_timeout_ms        = 30000
max_payload_bytes       = 65536
max_context_tokens      = 8192

[sandbox]
fuel            = 10000000
max_memory_mb   = 64
wall_timeout_ms = 50

[egress]
allow = []

[telemetry]
service_name  = "vanguard"
# Empty disables OTLP export. Point at a collector to turn it on, e.g.
# otlp_endpoint = "http://127.0.0.1:4317"
otlp_endpoint = ""
audit_log         = "./.vanguard/audit.jsonl"
audit_interval_ms = 1000
audit_batch       = 512
